<main class="register-page">
  <section class="register-card" aria-labelledby="register-title">
    <div class="register-card__intro">
      <a class="brand" routerLink="/" aria-label="Volver al inicio de AppointMee">
        <span class="brand__mark" aria-hidden="true">A</span>
        AppointMee
      </a>
      <span class="eyebrow">Una agenda a tu medida</span>
      <h1 id="register-title">Creá tu cuenta.</h1>
      <p>Organizá tus turnos y encontrá servicios sin perder tiempo.</p>
      <div class="intro-note">
        <strong>Tu contraseña debe incluir</strong>
        <span>8 caracteres, mayúscula, minúscula, número y símbolo.</span>
      </div>
    </div>

    <div class="register-card__form">
      @if (errorMessage()) {
        <p class="notice" role="alert">{{ errorMessage() }}</p>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field-grid">
          <label class="field">
            <span>Nombre</span>
            <input
              formControlName="nombre"
              autocomplete="given-name"
              (input)="clearBackendError('nombre')"
            />
            @if (backendError('nombre')) {
              <small>{{ backendError('nombre') }}</small>
            } @else if (form.controls.nombre.touched && form.controls.nombre.invalid) {
              <small>Usá entre 3 y 60 letras.</small>
            }
          </label>

          <label class="field">
            <span>Apellido</span>
            <input
              formControlName="apellido"
              autocomplete="family-name"
              (input)="clearBackendError('apellido')"
            />
            @if (backendError('apellido')) {
              <small>{{ backendError('apellido') }}</small>
            } @else if (form.controls.apellido.touched && form.controls.apellido.invalid) {
              <small>Usá entre 3 y 60 letras.</small>
            }
          </label>
        </div>

        <label class="field">
          <span>Correo electrónico</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="vos@ejemplo.com"
            (input)="clearBackendError('email')"
          />
          @if (backendError('email')) {
            <small>{{ backendError('email') }}</small>
          } @else if (form.controls.email.touched && form.controls.email.invalid) {
            <small>Ingresá un correo válido de entre 8 y 150 caracteres.</small>
          }
        </label>

        <div class="field-grid">
          <label class="field">
            <span>Contraseña</span>
            <input
              type="password"
              formControlName="password"
              autocomplete="new-password"
              (input)="clearBackendError('password')"
            />
            @if (backendError('password')) {
              <small>{{ backendError('password') }}</small>
            } @else if (form.controls.password.touched && form.controls.password.invalid) {
              <small>No cumple los requisitos de seguridad.</small>
            }
          </label>

          <label class="field">
            <span>Repetir contraseña</span>
            <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
            @if (
              form.controls.confirmPassword.touched &&
              form.controls.confirmPassword.hasError('required')
            ) {
              <small>Repetí tu contraseña.</small>
            } @else if (
              form.controls.confirmPassword.touched && form.hasError('passwordMismatch')
            ) {
              <small>Las contraseñas no coinciden.</small>
            }
          </label>
        </div>

        <label class="field">
          <span>Foto de perfil <em>opcional</em></span>
          <input
            type="url"
            formControlName="fotoUrl"
            autocomplete="url"
            placeholder="https://ejemplo.com/foto.jpg"
            (input)="clearBackendError('fotoUrl')"
          />
          @if (backendError('fotoUrl')) {
            <small>{{ backendError('fotoUrl') }}</small>
          }
        </label>

        <button class="submit" type="submit" [disabled]="submitting()">
          @if (submitting()) {
            Creando cuenta…
          } @else {
            Crear cuenta
          }
        </button>
      </form>

      <p class="form-footer">¿Ya tenés una cuenta? <a routerLink="/login">Iniciá sesión</a></p>
    </div>
  </section>
</main>
