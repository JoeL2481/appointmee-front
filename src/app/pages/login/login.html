<main class="auth-page">
  <section class="auth-card" aria-labelledby="login-title">
    <a class="brand" routerLink="/" aria-label="Volver al inicio de AppointMee">
      <span class="brand__mark" aria-hidden="true">A</span>
      AppointMee
    </a>

    <div class="auth-card__heading">
      <span class="eyebrow">Tu agenda te espera</span>
      <h1 id="login-title">Iniciá sesión</h1>
      <p>Volvé a tus turnos, sucursales y solicitudes desde un solo lugar.</p>
    </div>

    @if (successMessage()) {
      <p class="notice notice--success" role="status">{{ successMessage() }}</p>
    }

    @if (errorMessage()) {
      <p class="notice notice--error" role="alert">{{ errorMessage() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>Correo electrónico</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="vos@ejemplo.com"
          [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
        />
        @if (form.controls.email.touched && form.controls.email.hasError('required')) {
          <small>Ingresá tu correo electrónico.</small>
        } @else if (form.controls.email.touched && form.controls.email.hasError('email')) {
          <small>Ingresá un correo válido.</small>
        }
      </label>

      <label class="field">
        <span>Contraseña</span>
        <input
          type="password"
          formControlName="pass"
          autocomplete="current-password"
          placeholder="Tu contraseña"
          [attr.aria-invalid]="form.controls.pass.invalid && form.controls.pass.touched"
        />
        @if (form.controls.pass.touched && form.controls.pass.hasError('required')) {
          <small>Ingresá tu contraseña.</small>
        }
      </label>

      <div class="form-row">
        <a routerLink="/recuperar-cuenta">¿Desactivaste tu cuenta?</a>
      </div>

      <button class="submit" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          Ingresando…
        } @else {
          Ingresar
        }
      </button>
    </form>

    <p class="auth-card__footer">
      ¿Todavía no tenés cuenta? <a routerLink="/registro">Creala acá</a>
    </p>
  </section>
</main>
